description: >-
  DSW (Designer Shoe Warehouse) is the footwear and accessories retail banner of Designer
  Brands Inc. (NYSE: DBI), selling athletic shoes, sneakers, boots, sandals and accessories
  through roughly 500 US stores, the dsw.com storefront, a mobile app, and the DSW VIP
  Rewards loyalty program. DSW publishes no public API, SDK, developer portal or
  machine-readable contract: dsw.com is a client-side Angular application served by a
  private first-party backend at api.dsw.com, and supplier-side integration runs over EDI
  through the Designer Brands vendor portal rather than a partner API.
